<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/static/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>VCDS - Iniciar Sesión</title>
<link rel="stylesheet" href="/static/style.css">
<style>
:root {
  --bg: #080a08;
  --bg-card: #0e110e;
  --bg-input: #141814;
  --bg-hover: #171b16;
  --text: #f4f5f2;
  --text-sub: #b6bbb0;
  --text-muted: #7f867a;
  --border: rgba(255,255,255,0.12);
  --accent: #d7ff3f;
  --accent-ink: #0c0f02;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body {
  background: var(--bg);
  background-image: radial-gradient(rgba(215,255,63,0.05) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
}
::selection { background: var(--accent); color: var(--accent-ink); }
.login-card { background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 12px 48px rgba(0,0,0,0.55); }
.login-card h1 { color: var(--text); font-family: var(--font-mono); letter-spacing: 0.1em; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
.login-card h1::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.login-card .login-subtitle { color: var(--text-sub); font-family: var(--font-mono); font-size: 0.78rem; }
.form-group label { color: var(--text-muted); font-family: var(--font-mono); }
.form-group input { background: var(--bg-input); color: var(--text); border-color: var(--border); font-family: var(--font-mono); font-size: 0.9rem; }
.form-group input:focus { background: var(--bg-hover); outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(215,255,63,0.15); }
.form-group input::placeholder { color: var(--text-muted); }
.login-wrapper p { color: var(--text-muted); }
.login-wrapper { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:80vh; }
.login-card { border-radius:16px; padding:2.5rem; width:100%; max-width:400px; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
.login-card h1 { font-size:1.5rem; text-align:center; margin-bottom:0.5rem; display:block; justify-content:unset; }
.login-card .login-subtitle { text-align:center; font-size:0.9rem; margin-bottom:1.5rem; }
.login-card .logo-center { text-align:center; margin-bottom:1.5rem; }
.login-card .logo-center img { height:80px; width:auto; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.35rem; }
.form-group input { width:100%; padding:0.7rem 1rem; border:1.5px solid; border-radius:8px; font-size:1rem; font-family:inherit; transition:border-color 0.2s, box-shadow 0.2s; box-sizing:border-box; }
.form-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(215,255,63,0.15); }
.login-btn { width:100%; padding:0.8rem; border:1px solid var(--accent); border-radius:8px; background:var(--accent); color:var(--accent-ink); font-size:0.9rem; font-weight:700; font-family:var(--font-mono); letter-spacing:0.06em; cursor:pointer; transition:all 0.2s; box-shadow:0 0 20px rgba(215,255,63,0.25); }
.login-btn:hover { filter:brightness(1.08); box-shadow:0 0 28px rgba(215,255,63,0.4); }
.login-btn:disabled { background:#3a403a; border-color:var(--border); color:var(--text-muted); cursor:not-allowed; box-shadow:none; }
.login-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.35); color:#f87171; padding:0.6rem 1rem; border-radius:8px; font-size:0.85rem; font-family:var(--font-mono); margin-bottom:1rem; display:none; }
.login-error.show { display:block; }
#loginVersion { font-family: var(--font-mono); }
#loginVersion::before { content: "> "; color: var(--accent); }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="logo-center">
      <img src="/static/logo.png?v=1.1.0" alt="Logo VCDS">
    </div>
    <h1 style="text-align:center">VCDS</h1>
    <p class="login-subtitle" style="text-align:center">Verificador de Certificados de Delitos Sexuales</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <input type="hidden" id="csrfToken" name="csrf_token">
      <button type="submit" class="login-btn" id="loginBtn">Iniciar sesión</button>
    </form>
  </div>
  <p id="loginVersion" style="text-align:center;color:#999;font-size:0.8rem;margin-top:1rem"></p>
</div>

<script>
if(localStorage.getItem('vcds-dark') !== '0') document.body.classList.add('dark-mode');
(function() {
  const form = document.getElementById('loginForm');
  const errorDiv = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  fetch('/api/auth/csrf').then(r=>r.json()).then(d=>{
    document.getElementById('csrfToken').value = d.token;
  });

  fetch('/api/version').then(r=>r.json()).then(d=>{
    if(d.version) document.getElementById('loginVersion').textContent = 'v'+d.version;
  }).catch(()=>{});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Iniciando sesión...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          csrf_token: document.getElementById('csrfToken').value,
        }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = '/';
      } else {
        errorDiv.textContent = data.detail || 'Credenciales incorrectas';
        errorDiv.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    } catch (err) {
      errorDiv.textContent = 'Error de conexión';
      errorDiv.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  });
})();
</script>
</body>
</html>
